name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # cancel-in-progress is false so runs queue instead of racing, but a run
      # that was queued behind another can still be for a commit main has
      # since moved past. Bail here so only the run for the current tip of
      # main proceeds, instead of silently redeploying stale code.
      - name: Skip if main has moved past this commit
        id: staleness
        run: |
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest_sha" != "${{ github.sha }}" ]; then
            echo "main is now at $latest_sha, this run was queued for ${{ github.sha }} — skipping deploy."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      # Pinned to an immutable commit SHA, not the mutable `v2` tag.
      - name: Setup Bun
        if: steps.staleness.outputs.stale != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: steps.staleness.outputs.stale != 'true'
        run: bun install --frozen-lockfile

      - name: Lint
        if: steps.staleness.outputs.stale != 'true'
        run: bun run lint

      - name: Type check
        if: steps.staleness.outputs.stale != 'true'
        run: bun run type-check

      # CLOUDFLARE_API_TOKEN/ACCOUNT_ID are scoped to this step only, not the
      # job-level env, so earlier steps never have them in their environment.
      - name: Build and deploy
        if: steps.staleness.outputs.stale != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy
